name: Release new versions

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.get-version.outputs.RELEASE_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - run: corepack enable
        if: github.event_name == 'workflow_dispatch'

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch'
        run: pnpm i

      - name: Configure Git
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Release Commit & Tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git checkout ${{ github.ref_name }}
          node ./scripts/release.mjs --ci
          git push origin ${{ github.ref_name }} --tags

      - name: Get release version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION=$(git describe --tags --abbrev=0)
            echo "RELEASE_VERSION=${VERSION#v}" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

  docker-release:
    needs: prepare-release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4
        with:
          ref: v${{ needs.prepare-release.outputs.release_version }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/huangtechhub/tech-tools:latest
            ghcr.io/huangtechhub/tech-tools:${{ env.RELEASE_VERSION }}

  github-release:
    runs-on: ubuntu-latest
    needs: [prepare-release, docker-release]
    env:
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4
        with:
          ref: v${{ needs.prepare-release.outputs.release_version }}

      - run: corepack enable

      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i

      - name: Build the app
        run: pnpm build

      - name: Zip the app
        run: zip -r tech-tools-${{ env.RELEASE_VERSION }}.zip dist/*

      - name: Get changelog
        id: changelog
        run: |
          EOF=$(openssl rand -hex 8)
          echo "changelog<<$EOF" >> $GITHUB_OUTPUT
          node ./scripts/getLatestChangelog.mjs >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: tech-tools-${{ env.RELEASE_VERSION }}.zip
          tag_name: v${{ env.RELEASE_VERSION }}
          draft: true
          prerelease: false
          body: |
            ## Docker images

            - GitHub Container Registry
              - `ghcr.io/huangtechhub/tech-tools:latest`
              - `ghcr.io/huangtechhub/tech-tools:${{ env.RELEASE_VERSION }}`

            ## Changelog

            ${{ steps.changelog.outputs.changelog }}
